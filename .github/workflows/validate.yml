name: Validate templates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Validate template schema itself
        run: uvx check-jsonschema --check-metaschema template.schema.json

      - name: Validate all templates against schema
        run: |
          status=0
          while IFS= read -r -d '' file; do
            echo "::group::$file"
            if ! uvx check-jsonschema --schemafile template.schema.json "$file"; then
              status=1
            fi
            echo "::endgroup::"
          done < <(find . -name '*.template.json' -not -path './.git/*' -print0)
          exit "$status"
